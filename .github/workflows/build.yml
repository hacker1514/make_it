name: Build make_it

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: make_it-windows
            executable: make_it.exe

          - os: ubuntu-latest
            artifact: make_it-linux
            executable: make_it

          - os: macos-latest
            artifact: make_it-macos
            executable: make_it

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name make_it make_it.py

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name make_it make_it.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: source/dist/${{ matrix.executable }}
