name: Build Executables for All OS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            asset_name: make_it_win.exe
            cmd: pyinstaller --onefile --name make_it_win --paths source source/make_it.py
            output_path: dist/make_it_win.exe

          - os: ubuntu-latest
            target: linux
            asset_name: make_it_linux
            cmd: pyinstaller --onefile --name make_it_linux --paths source source/make_it.py
            output_path: dist/make_it_linux

          - os: macos-latest
            target: macos
            asset_name: make_it_mac
            cmd: pyinstaller --onefile --name make_it_mac --paths source source/make_it.py
            output_path: dist/make_it_mac

          - os: ubuntu-latest
            target: termux
            asset_name: make_it_termux
            cmd: pyinstaller --onefile --name make_it_termux --paths source source/make_it.py
            output_path: dist/make_it_termux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source/requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: ${{ matrix.cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.output_path }}

  release:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/make_it_win.exe/make_it_win.exe
            ./artifacts/make_it_linux/make_it_linux
            ./artifacts/make_it_mac/make_it_mac
            ./artifacts/make_it_termux/make_it_termux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
